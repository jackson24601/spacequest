<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Outfit:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/game.css" />
  </head>
  <body>
    <div class="space" aria-hidden="true">
      <canvas id="starfield"></canvas>
      <div class="nebula nebula-a"></div>
      <div class="nebula nebula-b"></div>
      <div class="scanlines"></div>
    </div>

    <section id="screen-landing" class="screen hero" aria-label="Title screen">
      <h1 class="title" aria-label="Space Quest">
        <span class="word">
          <span class="letter" style="--i: 0">S</span>
          <span class="letter" style="--i: 1">p</span>
          <span class="letter" style="--i: 2">a</span>
          <span class="letter" style="--i: 3">c</span>
          <span class="letter" style="--i: 4">e</span>
        </span>
        <span class="word">
          <span class="letter" style="--i: 5">Q</span>
          <span class="letter" style="--i: 6">u</span>
          <span class="letter" style="--i: 7">e</span>
          <span class="letter" style="--i: 8">s</span>
          <span class="letter" style="--i: 9">t</span>
        </span>
      </h1>

      <button type="button" class="begin-btn" id="begin-quest">
        <span class="begin-btn__label">Begin Quest</span>
        <span class="begin-btn__glow" aria-hidden="true"></span>
      </button>
    </section>

    <section
      id="screen-adventure"
      class="screen"
      aria-label="Spaceship exploration"
      hidden
    >
      <div class="adventure-frame">
        <canvas id="adventure-canvas" width="960" height="540"></canvas>
      </div>
      <div class="adventure-hud">
        <span>Explore the ship</span>
        <span><strong>Tip:</strong> Touch an alien to enter combat</span>
      </div>
    </section>

    <section
      id="screen-combat"
      class="screen"
      aria-label="Combat encounter"
      hidden
      data-active="false"
    >
      <div class="combat-panel">
        <h2>Combat</h2>
        <p>
          A wild <span data-combat-enemy>alien</span> blocks the corridor!
          Turn-based battles are coming soon.
        </p>
        <div class="combat-actions">
          <button type="button" class="btn-flee" data-combat-flee>
            Flee to Corridor
          </button>
          <button type="button" class="btn-win" data-combat-win>
            Scare It Off
          </button>
        </div>
      </div>
    </section>

    <script src="js/starfield.js"></script>
    <script src="js/game/rooms.js"></script>
    <script src="js/game/input.js"></script>
    <script src="js/game/adventure.js"></script>
    <script src="js/game/combat.js"></script>
    <script src="js/game/app.js"></script>
  </body>
</html>
